<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>UI 方案对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DEDEDE;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;color:#111;padding:24px;display:flex;gap:26px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:10px}
.cap{font-size:15px;font-weight:600;color:#333;padding-left:4px}
.cap span{font-weight:400;color:#777;font-size:13px}
.fit{width:594px;height:1056px;position:relative;overflow:hidden;border-radius:18px;background:#000}
.screen{width:1080px;height:1920px;transform:scale(.55);transform-origin:top left;position:absolute;top:0;left:0;
  overflow:hidden;background:#111}
.bg{position:absolute;inset:0;background-size:cover;background-position:center 18%}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 62%,rgba(0,0,0,.42) 100%)}
/* 玻璃质感 */
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.circle{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px}
.topbar{position:absolute;top:44px;left:0;right:0;display:flex;align-items:center;gap:20px;padding:0 44px}
.title{margin:0 auto;font-size:30px;font-weight:600;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
/* 浮动商品标签 */
.pin{position:absolute;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:999px}
.pin img{width:52px;height:64px;object-fit:cover;border-radius:10px;background:#EDEDED}
.pin b{font-size:22px;font-weight:600;white-space:nowrap}
.pin i{width:34px;height:34px;border-radius:50%;background:#E23B2E;color:#fff;font-size:20px;font-style:normal;
  display:flex;align-items:center;justify-content:center}
/* 底部 Dock */
.dock{position:absolute;left:44px;right:44px;bottom:46px;border-radius:34px;padding:20px 22px 22px}
.rail{display:flex;gap:16px}
.thumb{width:142px;height:174px;border-radius:18px;overflow:hidden;background:#fff;position:relative;flex:0 0 142px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.on:after{content:"✓";position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;
  background:#111;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.cta{margin-top:18px;display:flex;gap:16px;align-items:center}
.pill-main{flex:1;background:#111;color:#fff;border-radius:999px;padding:30px 0;text-align:center;font-size:30px;font-weight:600}
.pill-ghost{background:rgba(255,255,255,.84);border-radius:999px;padding:24px 26px;font-size:24px;white-space:nowrap}
.qrchip{width:132px;height:132px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 132px}
.qrchip div{width:104px;height:104px;background:
  repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/16px 16px}
.meta{display:flex;gap:12px;align-items:center;margin-bottom:14px;font-size:22px;color:#333}
/* 右侧竖排 */
.sidestack{position:absolute;right:40px;bottom:600px;display:flex;flex-direction:column;gap:18px}
.sidebtn{width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:17px;color:#111;text-align:center;line-height:1.15}
.sidebtn em{font-style:normal;font-size:30px}
/* B 方案：右侧信息栏 */
.panel{position:absolute;right:44px;top:150px;width:342px;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:14px}
.bg.left{background-position:32% 16%}
.panel h4{font-size:22px;color:#666;font-weight:600}
.panel .p-name{font-size:30px;font-weight:600}
.panel .p-price{font-size:38px;font-weight:600}
.rowline{display:flex;justify-content:space-between;font-size:22px;color:#333}
.side-actions{position:absolute;left:44px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px}
.mini{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.15;text-align:center}
</style></head>
<body>
<!-- ================= 方案 A：底部 Dock ================= -->
<div class="col">
  <div class="cap">方案 A · 全屏人像 + 底部 Dock <span>主行动在底栏，右侧竖排次要动作</span></div>
  <div class="fit"><div class="screen">
    <div class="bg" style="background-image:url('../outputs/assets/process/worn__w1.jpg');background-position:50% 14%"></div>
    <div class="veil"></div>
    <div class="topbar">
      <div class="glass circle">←</div>
      <div class="title">试穿效果</div>
      <div class="glass circle">⋯</div>
    </div>
    <div class="glass pin" style="left:56px;top:640px"><i>×</i><b>燕麦羊毛开衫</b></div>
    <div class="glass pin" style="left:56px;top:1080px"><i>×</i><b>高腰阔腿长裤</b></div>
    <div class="sidestack">
      <div class="glass sidebtn"><em>↻</em>换一件</div>
      <div class="glass sidebtn"><em>☎</em>叫导购</div>
      <div class="glass sidebtn"><em>✕</em>清除</div>
    </div>
    <div class="glass dock">
      <div class="meta"><b>¥399</b><span>·</span><span>建议 M 码</span><span>·</span><span>本店现货 12 件</span></div>
      <div class="rail">
        <div class="thumb on"><img src="../outputs/assets/process/worn__w1.jpg"></div>
        <div class="thumb"><img src="../outputs/assets/process/worn__w2.jpg"></div>
        <div class="thumb"><img src="../outputs/assets/process/worn__w6.jpg"></div>
        <div class="thumb"><img src="../outputs/assets/process/worn__w4.jpg"></div>
      </div>
      <div class="cta">
        <div class="qrchip" id="qrA" style="display:block;padding:14px"></div>
        <div class="pill-main">扫码带走这张效果图</div>
      </div>
      <div style="text-align:center;font-size:19px;color:#666;margin-top:12px">取件码 9WRF4G · 7 天有效 · 画面 60 秒后自动清除</div>
    </div>
  </div></div>
</div>

<!-- ================= 方案 B：右侧悬浮信息栏 ================= -->
<div class="col">
  <div class="cap">方案 B · 右侧悬浮信息卡 <span>商品/尺码/二维码收在右栏，底部只留一条衣服横滑</span></div>
  <div class="fit"><div class="screen">
    <div class="bg left" style="background-image:url('../outputs/assets/process/worn__w4.jpg')"></div>
    <div class="veil"></div>
    <div class="topbar">
      <div class="glass circle">←</div>
      <div class="title">试穿效果</div>
      <div class="glass circle">⋯</div>
    </div>
    <div class="side-actions">
      <div class="glass mini">换一件</div>
      <div class="glass mini">叫导购</div>
      <div class="glass mini">清除</div>
    </div>
    <div class="glass panel">
      <h4>本次试穿（门店现货）</h4>
      <div class="p-name">卡其长款风衣</div>
      <div class="p-price">¥1,299</div>
      <div class="rowline"><span>尺码建议</span><b>M 码</b></div>
      <div class="rowline"><span>门店现货</span><b>4 件</b></div>
      <div style="height:1px;background:rgba(0,0,0,.08)"></div>
      <div style="display:flex;gap:16px;align-items:center">
        <div class="qrchip" id="qrB" style="width:150px;height:150px;flex:0 0 150px;padding:16px"></div>
        <div style="font-size:21px;line-height:1.6">扫码带走<br>效果图与尺码<br><b>取件码 9WRF4G</b></div>
      </div>
      <div class="pill-main" style="font-size:26px;padding:24px 0">扫码带走</div>
    </div>
    <div class="glass" style="position:absolute;left:44px;right:44px;bottom:46px;border-radius:30px;padding:18px 22px;display:flex;gap:16px">
      <div class="thumb" style="width:132px;height:164px;flex:0 0 132px"><img src="../outputs/assets/process/worn__w2.jpg"></div>
      <div class="thumb on" style="width:132px;height:164px;flex:0 0 132px"><img src="../outputs/assets/process/worn__w4.jpg"></div>
      <div class="thumb" style="width:132px;height:164px;flex:0 0 132px"><img src="../outputs/assets/process/worn__w6.jpg"></div>
      <div style="align-self:center;font-size:22px;color:#333;padding-left:6px">左右滑动换一件</div>
    </div>
  </div></div>
</div>
<script src="lib/qrcode.min.js"></script>
<script>
const q = 'MUYE TRY-ON | CODE:9WRF4G | https://m.muye.com/t/9WRF4G';
const mk = (id, size) => { const el = document.getElementById(id); if (el) new QRCode(el, { text:q, width:size, height:size, colorDark:'#111111', colorLight:'#FFFFFF', correctLevel:QRCode.CorrectLevel.M }); };
mk('qrA', 104); mk('qrB', 118);
</script>
</body></html>
